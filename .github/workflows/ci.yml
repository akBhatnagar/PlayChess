name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Lint, types, tests, and build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: playchess
          POSTGRES_PASSWORD: playchess
          POSTGRES_DB: playchess
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U playchess -d playchess"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://playchess:playchess@127.0.0.1:5432/playchess
      SESSION_SECRET: test-session-secret-must-be-32-characters
      WEB_ORIGIN: http://127.0.0.1:4317
      NODE_ENV: test
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@d9184bf108216479bc5a137cc391f4d7b14c870b # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Generate Prisma client
        run: pnpm exec prisma generate

      - name: Typecheck
        run: pnpm typecheck

      - name: Apply database migrations
        run: pnpm exec prisma migrate deploy

      - name: Test
        run: pnpm test

      - name: Production build
        run: pnpm build

      - name: Install Playwright browser
        run: pnpm --filter @playchess/web exec playwright install --with-deps chromium

      - name: End-to-end smoke
        run: pnpm test:e2e
