# Dedicated vhost for playchess.akshaybhatnagar.in.
# Install as a new site. Do not replace the global nginx.conf.
# Run `nginx -t` before reload.
# Certbot can add the TLS server block after the A record resolves.

server {
    listen 80;
    server_name playchess.akshaybhatnagar.in;

    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:4318;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
